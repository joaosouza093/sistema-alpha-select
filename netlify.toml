# Alpha Select — publicação no Netlify com banco e arquivos no Supabase.
#
#  • Frontend (React) estático em web/dist.
#  • API (Fastify) como Netlify Function em /api/* — mesmo domínio do site,
#    então cookies __Host-, SameSite=Strict, CSRF e verificação de origem
#    funcionam sem CORS.
#  • PostgreSQL + RLS e documentos (bucket privado) no Supabase.
#
# Variáveis obrigatórias: ver docs/DEPLOY_NETLIFY_SUPABASE.md.

[build]
  base = "."
  command = "npm run build -w web"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # pg tenta carregar o driver nativo opcional; não é usado.
  external_node_modules = ["pg-native"]

# SPA: rotas do React caem no index.html (arquivos e /api/* têm prioridade).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
